<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ember — a wood-fired neighborhood kitchen. Seasonal plates, a warm room, and a table waiting for you." />
    <title>Ember — Wood-Fired Kitchen</title>
    <style>
      /* Editorial serif display, sourced from the system stack (no web fetch, CSP-safe).
         @hanzo/gui headings render real <h1>/<h2>/<h3> tags; the `.serif` class is
         added to any display type that must read as the restaurant's masthead. */
      :root { color-scheme: light; }
      html, body { margin: 0; background: #FBF6EC; }
      h1, h2, h3, h4, .serif {
        font-family: 'Iowan Old Style', 'Palatino Linotype', 'Palatino', 'Book Antiqua',
          'Hoefler Text', Garamond, Georgia, 'Times New Roman', serif !important;
        letter-spacing: -0.012em;
      }
      /* Dotted price leaders on menu rows read as a printed carte. */
      .leader { border-bottom: 1px dotted #C8B79A; }
      ::selection { background: #E7B24422; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
